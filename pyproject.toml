[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "caspian"
version = "0.1.0"
description = "Project Caspian: Artificial Ontological Intelligence Research Platform"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Project Caspian Contributors" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["environment*", "agent*", "learning*", "models*", "configs*", "experiments*"]
